name: Pull Working Config
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore grace state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: vanity-grace-${{ github.run_id }}
          restore-keys: |
            vanity-grace-
      - name: Prepare configs
        env:
          CFG: ${{ secrets.CONFIG_JSON_B64 }}
        run: |
          mkdir -p exported
          if [ -f "state/config.json" ] && [ -s "state/config.json" ]; then
            cp state/config.json exported/cached_state_config.json
            echo "Cached state config found."
          fi
          if [ -n "${CFG:-}" ]; then
            printf '%s' "${CFG}" | base64 -d > exported/secret_config.json
            echo "Secret config decoded."
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-config
          path: exported/
          retention-days: 1
