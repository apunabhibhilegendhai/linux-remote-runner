name: "Linux RDP (Chrome Remote Desktop)"

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste command from remotedesktop.google.com/headless (Debian Linux)'
        required: true
        type: string
      pin:
        description: '6-digit PIN for remote connection (e.g. 123456)'
        required: true
        type: string
        default: '123456'

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Linux Kernel & Network Tuning
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes wget curl unzip htop tmux net-tools
          # Enable BBR and TCP Fast Open on the host
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Install Google Chrome Stable
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg --install google-chrome-stable_current_amd64.deb || sudo apt-get install --assume-yes --fix-broken

      - name: Install Chrome Remote Desktop
        run: |
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install --assume-yes --fix-broken

      - name: Install XFCE Desktop Environment
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes xfce4 desktop-base xfce4-terminal
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
          sudo systemctl disable gdm3.service || true

      - name: Configure Admin Permissions & User
        run: |
          sudo usermod -a -G chrome-remote-desktop $USER
          # Ensure passwordless sudo
          echo "$USER ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers

      - name: Start Chrome Remote Desktop Host
        env:
          AUTH_CODE: ${{ inputs.auth_code }}
          PIN: ${{ inputs.pin }}
        run: |
          export DISPLAY=
          if [[ "$AUTH_CODE" == *"--pin="* ]]; then
            eval "$AUTH_CODE"
          else
            eval "$AUTH_CODE --pin=$PIN"
          fi
          echo "=========================================================="
          echo "CRD HOST IS ONLINE!"
          echo "Go to: https://remotedesktop.google.com/access to connect"
          echo "=========================================================="

      - name: Keep Runner Alive
        run: |
          while true; do
            sleep 60
          done
