name: Linux Remote Environment

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize Linux Network Stack (BBR & Fast Open)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux htop curl wget git net-tools
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Launch Admin Terminal (SSH & Web Shell)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
