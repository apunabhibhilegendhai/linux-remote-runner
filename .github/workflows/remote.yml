name: "Linux Remote Runner"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  runner-session:
    runs-on: ubuntu-latest
    steps:
      - name: Disable needrestart & optimize kernel
        run: |
          sudo sed -i "s/#\$nrconf{restart} = 'i';/\$nrconf{restart} = 'a';/g" /etc/needrestart/needrestart.conf 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y tmate openssh-client curl wget htop tmux
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Start tmate and publish SSH connection
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          
          # Start tmate socket
          tmate -S /tmp/tmate.sock new-session -d
          
          echo "Waiting for tmate server connection..."
          SSH_CMD=""
          WEB_CMD=""
          for i in $(seq 1 40); do
            SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
            WEB_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
            if [ -n "$SSH_CMD" ] && [ -n "$WEB_CMD" ]; then
              echo "Tmate session ready in $i seconds!"
              break
            fi
            sleep 1
          done
          
          echo "=========================================================="
          echo "SSH COMMAND: $SSH_CMD"
          echo "WEB COMMAND: $WEB_CMD"
          echo "=========================================================="
          
          # Publish connection as a GitHub Issue for guaranteed retrieval
          python3 -c "
          import urllib.request, json, os
          tok = os.environ.get('GH_PAT') or os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          ssh = '$SSH_CMD'
          web = '$WEB_CMD'
          
          issue_data = json.dumps({
              'title': 'SSH_READY',
              'body': f'### Live Linux Terminal (US-East)\n- **Web Terminal:** {web}\n- **SSH Command:** \`{ssh}\`\n- **Direct SSH:** {ssh}'
          }).encode()
          
          req_issue = urllib.request.Request(f'https://api.github.com/repos/{repo}/issues', data=issue_data, headers={
              'Authorization': f'token {tok}',
              'User-Agent': 'Python',
              'Content-Type': 'application/json'
          })
          try:
              with urllib.request.urlopen(req_issue) as resp:
                  print('Issue created! Status:', resp.status)
          except Exception as e:
              print('Issue creation error:', e)
          "
          
          # Keep session running for remote commands
          while true; do
            sleep 10
          done
