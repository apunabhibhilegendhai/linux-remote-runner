name: "Linux Remote Runner"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  runner-session:
    runs-on: ubuntu-latest
    steps:
      - name: Optimize Linux Kernel & Network Stack
        run: |
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Install ttyd Web Terminal & Cloudflare Tunnel
        run: |
          sudo wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          sudo wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Launch Interactive Admin Terminal & Tunnel
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create interactive shell script that prints banner and stays active
          cat << 'EOF' > /tmp/start_shell.sh
          #!/bin/bash
          export TERM=xterm-256color
          export HOME=/home/runner
          export USER=runner
          cd /home/runner
          clear
          echo "=========================================================="
          echo "⚡ LINUX ADMIN TERMINAL ONLINE (US-EAST / AZURE)"
          echo "Host: $(uname -n) | Kernel: $(uname -r)"
          echo "TCP BBR: $(sysctl -n net.ipv4.tcp_congestion_control)"
          echo "User: $(whoami) (Passwordless sudo enabled)"
          echo "=========================================================="
          echo ""
          exec /bin/bash -i
          EOF
          chmod +x /tmp/start_shell.sh

          # Launch ttyd with interactive shell wrapper
          nohup ttyd -W -p 7681 -t fontSize=16 -t cursorBlink=true /tmp/start_shell.sh > /tmp/ttyd.log 2>&1 &
          sleep 2

          # Launch Cloudflare tunnel
          nohup cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/cf.log 2>&1 &

          # Wait for Cloudflare to issue public trycloudflare.com URL
          TUNNEL_URL=""
          for i in $(seq 1 40); do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "Cloudflare Tunnel is LIVE: $TUNNEL_URL"
              break
            fi
            sleep 1
          done

          echo "=========================================================="
          echo "ADMIN WEB TERMINAL: $TUNNEL_URL"
          echo "=========================================================="

          # Publish to GitHub Issues
          python3 -c "
          import urllib.request, json, os
          tok = os.environ.get('GH_PAT') or os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          url = '$TUNNEL_URL'

          issue_data = json.dumps({
              'title': 'LIVE_ADMIN_TERMINAL',
              'body': f'### 🚀 Interactive Admin Terminal\n\n**Direct Link:** {url}\n\nPre-warmed interactive bash session in Microsoft Azure US-East.'
          }).encode()

          req_issue = urllib.request.Request(f'https://api.github.com/repos/{repo}/issues', data=issue_data, headers={
              'Authorization': f'token {tok}',
              'User-Agent': 'Python',
              'Content-Type': 'application/json'
          })
          try:
              urllib.request.urlopen(req_issue)
              print('Issue updated successfully!')
          except Exception as e:
              print('Issue error:', e)
          "

          # Keep runner alive for remote control
          while true; do
            sleep 10
          done
