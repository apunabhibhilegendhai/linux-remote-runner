name: "Discord Vanity 24/7 Rolling Engine"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Toolkit Mode (guard, sniper, grace, swap)"
        required: true
        default: "guard"
        type: choice
        options:
          - guard
          - sniper
          - grace
          - swap

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  engine-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository Skeleton
        uses: actions/checkout@v4

      - name: Optimize Linux Kernel & Network Stack (BBR & Fast Open)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bzip2 curl wget tmux htop nano
          # Enable BBR & TCP Fast Open
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Restore Persistent State (configs, grace.json & progress)
        uses: actions/cache@v4
        with:
          path: state/
          key: vanity-state-${{ github.run_id }}
          restore-keys: vanity-state-

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Runtime Dependencies & uvloop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uvloop

      - name: Zero-Exposure In-Memory Code & Config Restoration
        env:
          PART1: ${{ secrets.SNIPER_CODE_PART1 }}
          PART2: ${{ secrets.SNIPER_CODE_PART2 }}
          CFG: ${{ secrets.CONFIG_JSON_B64 }}
        run: |
          # Decompress discord.py.py from encrypted secrets directly into memory
          echo "${PART1}${PART2}" | base64 -d | bzip2 -d > discord.py.py
          chmod 600 discord.py.py

          # Check if an updated config.json was cached from previous manual edits
          mkdir -p state
          if [ -f "state/config.json" ]; then
            cp state/config.json config.json
            echo "Loaded user-updated config.json from cache."
          else
            echo "${CFG}" | base64 -d > config.json
            cp config.json state/config.json
            echo "Loaded default config.json."
          fi
          chmod 600 config.json

          # Restore cached grace tracking if available
          if [ -f "state/grace.json" ]; then
            cp state/grace.json grace.json
            echo "Restored persistent grace.json from cache."
          fi

      - name: Setup Background Admin Terminal (ttyd & Cloudflare Tunnel)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Download ttyd and cloudflared
          sudo wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          sudo wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # 2. Interactive shell wrapper for user manual config editing
          cat << 'EOF' > /tmp/admin_shell.sh
          #!/bin/bash
          export TERM=xterm-256color
          export HOME=/home/runner
          export USER=runner
          cd /home/runner/work/linux-remote-runner/linux-remote-runner
          clear
          echo "=========================================================="
          echo "⚡ DISCORD VANITY ADMIN TERMINAL (US-EAST / AZURE)"
          echo "To edit your token/guilds: nano config.json"
          echo "To watch live logs: tail -f /tmp/sniper.log"
          echo "To restart sniper manually: pkill -f discord.py.py"
          echo "=========================================================="
          echo ""
          exec /bin/bash -i
          EOF
          chmod +x /tmp/admin_shell.sh

          # 3. Start ttyd & tunnel in background
          nohup ttyd -W -p 7681 -t fontSize=16 /tmp/admin_shell.sh > /tmp/ttyd.log 2>&1 &
          sleep 2
          nohup cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/cf.log 2>&1 &

          # 4. Extract public URL and report to GitHub Issues
          TUNNEL_URL=""
          for i in $(seq 1 40); do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "Admin Config Terminal is LIVE: $TUNNEL_URL"
              break
            fi
            sleep 1
          done

          python3 -c "
          import urllib.request, json, os
          tok = os.environ.get('GH_PAT') or os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          url = '$TUNNEL_URL'

          issue_data = json.dumps({
              'title': 'LIVE_ADMIN_TERMINAL_URL',
              'body': f'### ⚡ Admin Terminal Online\n\n**Direct Terminal Link:** {url}\n\n- Edit config: \`nano config.json\`\n- Watch live logs: \`tail -f /tmp/sniper.log\`\n\nEdits to \`config.json\` automatically sync to cache every 30 seconds.'
          }).encode()

          req_issue = urllib.request.Request(f'https://api.github.com/repos/{repo}/issues', data=issue_data, headers={
              'Authorization': f'token {tok}',
              'User-Agent': 'Python',
              'Content-Type': 'application/json'
          })
          try:
              urllib.request.urlopen(req_issue)
              print('Admin terminal link published to GitHub Issues!')
          except Exception as e:
              print('Issue publish error:', e)
          "

      - name: Run Engine with Auto-Rolling Handoff (350 Minutes)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'guard' }}
        run: |
          python3 -c "
          import subprocess, time, os, sys, signal, urllib.request, json

          mode = os.environ.get('MODE', 'guard')
          pat = os.environ.get('GH_PAT') or os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')

          MAX_RUNTIME_SECONDS = 350 * 60
          t0 = time.time()
          proc = None
          last_started_mtime = 0

          print(f'Supervisor active for mode {mode}.')

          while True:
              elapsed = time.time() - t0

              # 1. Check if config.json has an active token
              has_token = False
              try:
                  if os.path.exists('config.json'):
                      with open('config.json', 'r') as f:
                          cfg = json.load(f)
                      tok = cfg.get('token') or cfg.get('sniper_token')
                      has_token = bool(tok and str(tok).strip() and str(tok).strip() != 'YOUR_ACCOUNT_TOKEN')
              except Exception:
                  has_token = False

              # 2. If token is present and process not running, start it
              if has_token:
                  # Check if config was modified by user in terminal -> restart process with new config
                  curr_mtime = os.path.getmtime('config.json') if os.path.exists('config.json') else 0
                  if proc is not None and curr_mtime > last_started_mtime and last_started_mtime > 0:
                      print('Detected config.json update from terminal. Restarting process...')
                      proc.terminate()
                      try:
                          proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                      proc = None

                  if proc is None or proc.poll() is not None:
                      print(f'Starting toolkit process ({mode} mode)...')
                      last_started_mtime = curr_mtime
                      log_file = open('/tmp/sniper.log', 'a')
                      proc = subprocess.Popen(
                          [sys.executable, '-u', 'discord.py.py', mode],
                          stdout=log_file,
                          stderr=log_file
                      )
              else:
                  # Missing token: do NOT exit! Keep terminal alive and wait for user to input token
                  if int(elapsed) % 30 == 0:
                      print('Waiting for account token in config.json... Open the terminal link and run: nano config.json')

              # 3. Synchronize state cache every 30 seconds
              if int(elapsed) % 30 == 0:
                  if os.path.exists('config.json'):
                      subprocess.run(['cp', '-f', 'config.json', 'state/config.json'])
                  if os.path.exists('grace.json'):
                      subprocess.run(['cp', '-f', 'grace.json', 'state/grace.json'])

              # 4. Check 350-minute handoff threshold
              if elapsed >= MAX_RUNTIME_SECONDS:
                  print('350-minute mark reached. Initiating seamless rolling handoff to Runner #2...')
                  if os.path.exists('config.json'):
                      subprocess.run(['cp', '-f', 'config.json', 'state/config.json'])
                  if os.path.exists('grace.json'):
                      subprocess.run(['cp', '-f', 'grace.json', 'state/grace.json'])

                  try:
                      url = f'https://api.github.com/repos/{repo}/actions/workflows/sniper.yml/dispatches'
                      payload = json.dumps({'ref': 'main', 'inputs': {'mode': mode}}).encode()
                      req = urllib.request.Request(url, data=payload, headers={
                          'Authorization': f'token {pat}',
                          'User-Agent': 'Rolling-Dispatcher',
                          'Content-Type': 'application/json'
                      })
                      with urllib.request.urlopen(req) as resp:
                          print('Triggered next runner! Status:', resp.status)
                  except Exception as exc:
                      print('Error dispatching next runner:', exc)

                  time.sleep(30)
                  print('Shutting down previous session gracefully...')
                  if proc is not None:
                      proc.send_signal(signal.SIGINT)
                      try:
                          proc.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                  break

              time.sleep(5)
          "

      - name: Save Persistent State Before Shutdown
        if: always()
        run: |
          mkdir -p state
          if [ -f "config.json" ]; then
            cp -f config.json state/config.json
            echo "Persisted config.json to state cache."
          fi
          if [ -f "grace.json" ]; then
            cp -f grace.json state/grace.json
            echo "Persisted grace.json to state cache."
          fi
          rm -f discord.py.py config.json
