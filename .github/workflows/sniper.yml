name: "Discord Vanity Rolling Engine"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Toolkit mode (guard, sniper, grace, swap)"
        required: true
        default: "guard"
        type: choice
        options:
          - guard
          - sniper
          - grace
          - swap

# The default token only needs to read the repo and dispatch the next rolling
# run.  Do not grant contents: write: the engine never pushes code.
permissions:
  actions: write
  contents: read

# Serialize runs so two engines never fight over the same vanity.  A handoff
# dispatched near the end of a run waits here until the old job exits.
concurrency:
  group: vanity-engine
  cancel-in-progress: false

jobs:
  engine-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tune Linux network stack
        run: |
          set -euo pipefail

          # Do NOT pin /etc/hosts.  Discord anycast is measured at runtime by
          # the engine (DNSPreResolver); a hard-coded edge can be the slow one.
          for pkg in bzip2 ethtool; do
            command -v "$pkg" >/dev/null 2>&1 || sudo apt-get install -y "$pkg" || true
          done

          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          sudo sysctl -w net.ipv4.tcp_notsent_lowat=1024 || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true
          sudo sysctl -w net.ipv4.tcp_no_metrics_save=1 || true
          sudo sysctl -w net.ipv4.tcp_autocorking=0 || true
          sudo sysctl -w net.ipv4.tcp_fin_timeout=10 || true
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
          sudo sysctl -w net.core.rmem_max=33554432 || true
          sudo sysctl -w net.core.wmem_max=33554432 || true
          sudo sysctl -w net.core.rmem_default=8388608 || true
          sudo sysctl -w net.core.wmem_default=8388608 || true
          sudo sysctl -w net.core.netdev_max_backlog=65536 || true
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=65536 || true

          IFACE=$(ip route show default | awk '{print $5}' | head -n 1)
          if [ -n "$IFACE" ]; then
            sudo ethtool -G "$IFACE" rx 4096 tx 4096 || true
            sudo ethtool -C "$IFACE" adaptive-rx off rx-usecs 0 rx-frames 1 || true
          fi

          for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -e "$g" ] && echo performance | sudo tee "$g" >/dev/null 2>&1 || true
          done

      - name: Restore grace state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: vanity-grace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vanity-grace-

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore engine code and config from secrets
        env:
          PART1: ${{ secrets.SNIPER_CODE_PART1 }}
          PART2: ${{ secrets.SNIPER_CODE_PART2 }}
          PART3: ${{ secrets.SNIPER_CODE_PART3 }}
          PART4: ${{ secrets.SNIPER_CODE_PART4 }}
          CFG: ${{ secrets.CONFIG_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077

          if [ -n "${PART1:-}" ]; then
            printf '%s' "${PART1}${PART2:-}${PART3:-}${PART4:-}" | base64 -d | bzip2 -dc > discord.py.py
            echo "Loaded discord.py.py from repository secrets."
          fi

          if [ ! -s discord.py.py ]; then
            echo "::error::discord.py.py is missing. Set SNIPER_CODE_PART1/SNIPER_CODE_PART2/SNIPER_CODE_PART3 or add the engine file to the repo."
            exit 1
          fi
          python -m py_compile discord.py.py

          if [ -n "${CFG:-}" ]; then
            printf '%s' "${CFG}" | base64 -d > config.json
          fi

          if [ ! -s config.json ]; then
            echo "::error::config.json is missing. Set the CONFIG_JSON_B64 repository secret."
            exit 1
          fi
          chmod 600 discord.py.py config.json

          # Validate without ever printing a token.
          python - <<'PY'
          import json
          import sys

          try:
              with open("config.json", "r", encoding="utf-8") as fh:
                  cfg = json.load(fh)
          except Exception as exc:
              print(f"::error::config.json is not valid JSON ({type(exc).__name__})")
              sys.exit(1)

          def usable(key):
              value = str(cfg.get(key) or "").strip()
              return bool(value) and not value.startswith("YOUR_")

          if not any(usable(k) for k in ("token", "sniper_token", "monitor_token")):
              print("::error::config.json contains no usable Discord token")
              sys.exit(1)
          print("Config validated.")
          PY

      - name: Restore grace state file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil

          try:
              with open("config.json", "r", encoding="utf-8") as fh:
                  cfg = json.load(fh)
          except Exception:
              cfg = {}

          raw = str(cfg.get("grace_file") or "grace.json").strip() or "grace.json"
          target = os.path.abspath(os.path.expanduser(raw))
          cached = os.path.join("state", os.path.basename(target))
          if os.path.isfile(cached):
              parent = os.path.dirname(target)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              if os.path.abspath(cached) != os.path.abspath(target):
                  shutil.copyfile(cached, target)
              print(f"Restored grace state to {raw} from cache.")
          else:
              print(f"No cached grace state for {raw}; starting fresh.")
          PY

      - name: Run rolling engine supervisor
        env:
          MODE: ${{ inputs.mode || 'guard' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cat > supervisor.py <<'PY'
          import json
          import os
          import signal
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone

          MODE = os.environ.get("MODE", "guard")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          REF = os.environ.get("GITHUB_REF_NAME", "main")
          TOKEN = os.environ.get("GITHUB_TOKEN", "")

          MAX_RUNTIME_SECONDS = 350 * 60
          HEARTBEAT_SECONDS = 300
          SYNC_SECONDS = 30
          ONE_SHOT = MODE in ("swap", "instant", "claim")

          # Never inherit the supervisor's secrets.  The engine only needs the
          # runtime environment and any proxy settings it is explicitly given.
          ALLOWED_ENV = (
              "PATH", "HOME", "LANG", "LC_ALL", "LC_CTYPE", "TZ", "TERM",
              "SSL_CERT_FILE", "SSL_CERT_DIR",
              "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY",
              "http_proxy", "https_proxy", "no_proxy",
          )


          def log(message):
              stamp = datetime.now(timezone.utc).strftime("%H:%M:%SZ")
              print(f"[{stamp}] {message}", flush=True)


          def load_config():
              try:
                  with open("config.json", "r", encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}


          def has_token(cfg):
              for key in ("token", "sniper_token", "monitor_token"):
                  value = str(cfg.get(key) or "").strip()
                  if value and not value.startswith("YOUR_"):
                      return True
              return False


          def child_env():
              env = {key: os.environ[key] for key in ALLOWED_ENV if key in os.environ}
              env["PYTHONUNBUFFERED"] = "1"
              env["PYTHONDONTWRITEBYTECODE"] = "1"
              return env


          def grace_file_path():
              cfg = load_config()
              raw = str(cfg.get("grace_file") or "grace.json").strip() or "grace.json"
              return os.path.abspath(os.path.expanduser(raw))


          def sync_state():
              try:
                  os.makedirs("state", exist_ok=True)
                  src_path = grace_file_path()
                  if os.path.exists(src_path):
                      name = os.path.basename(src_path) or "grace.json"
                      tmp = os.path.join("state", name + ".tmp")
                      with open(src_path, "rb") as src, open(tmp, "wb") as dst:
                          dst.write(src.read())
                      os.replace(tmp, os.path.join("state", name))
              except Exception as exc:
                  log(f"state sync failed: {exc}")


          def dispatch_next():
              if not REPO or not TOKEN:
                  log("handoff skipped: missing repository or token")
                  return False
              url = f"https://api.github.com/repos/{REPO}/actions/workflows/sniper.yml/dispatches"
              payload = json.dumps({"ref": REF, "inputs": {"mode": MODE}}).encode()
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vanity-rolling-dispatcher",
                  "Content-Type": "application/json",
              }
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(url, data=payload, headers=headers)
                      with urllib.request.urlopen(request, timeout=15) as response:
                          log(f"handoff dispatched (HTTP {response.status})")
                          return True
                  except Exception as exc:
                      log(f"handoff attempt {attempt}/3 failed: {exc}")
                      time.sleep(5 * attempt)
              return False


          def start_engine():
              return subprocess.Popen(
                  [sys.executable, "-u", "discord.py.py", MODE],
                  cwd=os.getcwd(),
                  env=child_env(),
              )


          def stop_engine(proc):
              if proc is None or proc.poll() is not None:
                  return
              try:
                  proc.send_signal(signal.SIGINT)
                  proc.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      pass
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass


          def heartbeat(proc, elapsed, last_ping):
              status = f"ACTIVE (PID {proc.pid})" if proc and proc.poll() is None else "RESTARTING"
              ping = "n/a"
              if time.time() - last_ping >= HEARTBEAT_SECONDS:
                  try:
                      request = urllib.request.Request(
                          "https://discord.com/api/v10/gateway", method="HEAD"
                      )
                      start = time.perf_counter()
                      with urllib.request.urlopen(request, timeout=3):
                          ping = f"{(time.perf_counter() - start) * 1000:.1f}ms"
                  except Exception:
                      ping = "timeout/error"
              log(
                  f"heartbeat | mode={MODE} | uptime={int(elapsed // 60)}m/"
                  f"{MAX_RUNTIME_SECONDS // 60}m | {status} | Discord={ping}"
              )


          def main():
              cfg = load_config()
              if not has_token(cfg):
                  log("no usable token in config.json; refusing to idle")
                  return 1

              sync_state()

              if ONE_SHOT:
                  log(f"one-shot mode={MODE}; running once")
                  proc = start_engine()
                  code = proc.wait()
                  sync_state()
                  log(f"one-shot engine exited with code {code}")
                  return code

              log(f"supervisor started | mode={MODE} | ref={REF}")

              started = time.time()
              last_heartbeat = -HEARTBEAT_SECONDS
              last_ping = -HEARTBEAT_SECONDS
              last_sync = 0.0
              crash_count = 0
              last_crash = 0.0
              restart_delay = 0.0
              engine_started_at = 0.0
              proc = None

              try:
                  while True:
                      now = time.time()
                      elapsed = now - started

                      if proc is not None and proc.poll() is None:
                          if engine_started_at and (now - engine_started_at) >= 60.0:
                              if crash_count:
                                  log("engine healthy for 60s; resetting crash backoff")
                                  crash_count = 0
                              engine_started_at = now

                      if proc is not None and proc.poll() is not None:
                          exit_code = proc.returncode
                          proc = None
                          engine_started_at = 0.0
                          crash_count += 1
                          last_crash = now
                          restart_delay = min(120.0, 5.0 * (2 ** min(crash_count - 1, 5)))
                          log(
                              f"engine exited with code {exit_code}; "
                              f"restart in {restart_delay:.0f}s"
                          )

                      if proc is None and (now - last_crash) >= restart_delay:
                          proc = start_engine()
                          engine_started_at = now
                          log(f"engine started (PID {proc.pid})")

                      if now - last_sync >= SYNC_SECONDS:
                          last_sync = now
                          sync_state()

                      if now - last_heartbeat >= HEARTBEAT_SECONDS:
                          last_heartbeat = now
                          heartbeat(proc, elapsed, last_ping)
                          last_ping = now

                      if elapsed >= MAX_RUNTIME_SECONDS:
                          log("runtime limit reached; dispatching handoff")
                          sync_state()
                          dispatched = dispatch_next()
                          if not dispatched:
                              log("handoff failed; exiting without a successor")
                          time.sleep(30)
                          stop_engine(proc)
                          proc = None
                          break

                      time.sleep(2)
              finally:
                  stop_engine(proc)
                  sync_state()

              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

          python3 supervisor.py

      - name: Prepare state for cache
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil

          os.makedirs("state", exist_ok=True)
          try:
              with open("config.json", "r", encoding="utf-8") as fh:
                  cfg = json.load(fh)
          except Exception:
              cfg = {}

          raw = str(cfg.get("grace_file") or "grace.json").strip() or "grace.json"
          src = os.path.abspath(os.path.expanduser(raw))
          name = os.path.basename(src) or "grace.json"
          dst = os.path.join("state", name)
          if os.path.isfile(src):
              if os.path.abspath(src) != os.path.abspath(dst):
                  shutil.copyfile(src, dst)
          elif not os.path.exists(dst):
              with open(dst, "w", encoding="utf-8") as fh:
                  fh.write("{}")
          PY

      - name: Save grace state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: vanity-grace-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove secrets from workspace
        if: always()
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os

          try:
              with open("config.json", "r", encoding="utf-8") as fh:
                  cfg = json.load(fh)
          except Exception:
              cfg = {}

          raw = str(cfg.get("grace_file") or "grace.json").strip() or "grace.json"
          try:
              os.remove(os.path.abspath(os.path.expanduser(raw)))
          except OSError:
              pass
          PY
          rm -f discord.py.py config.json supervisor.py
          rm -rf state
